[project]
name = "nyx"
version = "0.1.0"
description = "NYX - evidence-backed critic and ecosystem oversight service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "typer>=0.15",
    "httpx>=0.27",
    "python-json-logger>=2.0",
]

[project.scripts]
nyx = "nyx.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.118",
    "jsonschema>=4.23",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
# B008: FastAPI's documented dependency-injection idiom uses `Depends()` in argument defaults.
ignore = ["S101", "B008"]

[tool.ruff.format]
# Design documents may contain illustrative Python snippets that are not source files.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src"]
