[project]
name = "nyx"
version = "0.1.0"
description = "NYX - evidence-backed critic and ecosystem oversight service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "typer>=0.15",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    # src/nyx/critics/llm.py validates structured model output against a JSON Schema. It was a
    # dev dependency, which would break at import the moment Phase 6 wires the critic in.
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# The conversational shell (Phase 7). Kept as an extra so the deterministic core
# does not require it: `pip install nyx` stays lean, `pip install nyx[conversational]`
# pulls in the MCP server and its LLM transport.
conversational = [
    "mcp>=2.3",
]

[project.scripts]
nyx = "nyx.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.118",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode lets two test files share a basename in different directories
# (tests/unit/test_finding_lifecycle.py and tests/integration/test_finding_lifecycle.py, both
# named by the acceptance table) without __init__.py files.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
# B008: FastAPI's documented dependency-injection idiom uses `Depends()` in argument defaults.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Developer tooling under scripts/ deliberately spawns uv/alembic/uvicorn as subprocesses with
# partial executable paths resolved from PATH. That is the point of these scripts, and they are
# not part of the shipped service, so the subprocess-security rules do not apply to them.
"scripts/*.py" = ["S603", "S607", "S110", "SIM105"]

[tool.ruff.format]
# Design documents may contain illustrative Python snippets that are not source files.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src"]
