name: Security scanning

on:
  push:
    branches: [master]
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Dependency scanning of the checked-in lockfile. `uv audit` needs no network credentials.
      # If it is ever unavailable, pip-audit against the same lock is the documented fallback.
      - name: Audit dependencies (uv)
        run: uv audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t nyx:scan .

      # Trivy fails the job on a FIXABLE or higher finding. Informational findings are reported,
      # not fatal -- a base image with an informational CVE is not a reason to block a merge.
      # v0.28.0 is unusable: its composite action pins aquasecurity/setup-trivy@v0.2.1, which
      # does not exist (setup-trivy tags are v0.2.6 / v0.3.0 / v0.3.1), so the job died at the
      # "Install Trivy" step. v0.36.0 pins setup-trivy and actions/cache by full SHA and both
      # resolve. Every input below is still valid at v0.36.0.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nyx:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          # Scoped exceptions with reasons, in .trivyignore. Anything not listed still fails.
          # v0.36.0 renamed this input from `ignorefile` to `trivyignores`.
          trivyignores: .trivyignore
