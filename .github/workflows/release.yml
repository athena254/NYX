name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nyx-windows-x86_64
            sep: ";"
            ext: ".exe"
          - os: ubuntu-latest
            artifact: nyx-linux-x86_64
            sep: ":"
            ext: ""
          - os: macos-latest
            artifact: nyx-macos-arm64
            sep: ":"
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --python 3.12

      - name: Build executable
        shell: bash
        run: |
          uv run --with pyinstaller python -m PyInstaller \
            --onefile --name nyx --paths src --clean --noconfirm \
            --add-data "alembic.ini${{ matrix.sep }}." \
            --add-data "migrations${{ matrix.sep }}migrations" \
            --add-data "docs/openapi.json${{ matrix.sep }}docs" \
            packaging/entry.py
          mv "dist/nyx${{ matrix.ext }}" "dist/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Smoke test
        shell: bash
        run: |
          "./dist/${{ matrix.artifact }}${{ matrix.ext }}" --help
          export NYX_DATABASE_URL="sqlite:///./smoke.sqlite3"
          export NYX_DATA_DIR="$PWD/smoke-data"
          mkdir -p "$NYX_DATA_DIR"
          uv run alembic upgrade head
          "./dist/${{ matrix.artifact }}${{ matrix.ext }}" doctor
          rm -f smoke.sqlite3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true